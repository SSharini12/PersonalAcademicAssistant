{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow p-4">

        <h2 class="mb-4">Student Profile</h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Age</label>
                    <input
                        type="number"
                        class="form-control"
                        name="age"
                        value="{{ student.age or '' }}"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Gender</label>
                    <select class="form-select" name="gender">

                        <option value="0"
                        {% if student.gender == 0 %}selected{% endif %}>
                        Female
                        </option>

                        <option value="1"
                        {% if student.gender == 1 %}selected{% endif %}>
                        Male
                        </option>

                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Study Time (hours/week)</label>
                    <input
                        type="number"
                        step="0.1"
                        class="form-control"
                        name="study_time"
                        value="{{ student.study_time or '' }}"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Absences</label>
                    <input
                        type="number"
                        class="form-control"
                        name="absences"
                        value="{{ student.absences or '' }}"
                        required>
                </div>

            </div>
            <div class="row">

    <div class="col-md-6 mb-3">
        <label>Tutoring</label>
        <select class="form-select" name="tutoring">
            <option value="0" {% if student.tutoring == 0 %}selected{% endif %}>No</option>
            <option value="1" {% if student.tutoring == 1 %}selected{% endif %}>Yes</option>
        </select>
    </div>

    <div class="col-md-6 mb-3">
        <label>Parental Support</label>
        <select class="form-select" name="parental_support">
            <option value="0">Very Low</option>
            <option value="1">Low</option>
            <option value="2">Moderate</option>
            <option value="3">High</option>
            <option value="4">Very High</option>
        </select>
    </div>

    <div class="col-md-6 mb-3">
        <label>Extracurricular Activities</label>
        <select class="form-select" name="extracurricular">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>
    </div>

    <div class="col-md-6 mb-3">
        <label>Sports</label>
        <select class="form-select" name="sports">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>
    </div>

    <div class="col-md-6 mb-3">
        <label>Music</label>
        <select class="form-select" name="music">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>
    </div>

    <div class="col-md-6 mb-3">
        <label>Volunteering</label>
        <select class="form-select" name="volunteering">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>
    </div>

</div>
            <button class="btn btn-primary">
                Save Profile
            </button>

        </form>

    </div>

</div>

{% endblock %}
