<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#2563eb,#4f46e5);

}

.container{

width:380px;

background:white;

padding:35px;

border-radius:15px;

box-shadow:0 10px 20px rgba(0,0,0,.2);

}

h2{

text-align:center;

margin-bottom:25px;

color:#2563eb;

}

input{

width:100%;

padding:12px;

margin:12px 0;

border-radius:8px;

border:1px solid #ccc;

}

button{

width:100%;

padding:12px;

background:#2563eb;

color:white;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

.flash{

background:#fee2e2;

color:#991b1b;

padding:10px;

margin-bottom:15px;

border-radius:8px;

text-align:center;

}

p{

text-align:center;

margin-top:20px;

}

a{

text-decoration:none;

color:#2563eb;

font-weight:bold;

}

</style>

</head>

<body>

<div class="container login-page">

<h2>Student Login</h2>

{% with messages=get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
<div class="flash">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<p>

Don't have an account?

<a href="{{ url_for('signup') }}">

Register

</a>

</p>

</div>

</body>

</html>
