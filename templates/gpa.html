{% extends "layout.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row">

        <!-- Add Subject -->
        <div class="col-md-5">

            <div class="card shadow p-4">

                <h3 class="mb-3">Add Subject</h3>

                <form method="POST">

                    <div class="mb-3">
                        <label>Subject</label>
                        <input
                            type="text"
                            class="form-control"
                            name="subject"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Credits</label>
                        <input
                            type="number"
                            class="form-control"
                            name="credits"
                            min="1"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Grade</label>

                        <select
                            class="form-select"
                            name="grade"
                            required>

                            <option value="O">O</option>
                            <option value="A+">A+</option>
                            <option value="A">A</option>
                            <option value="B+">B+</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="F">F</option>

                        </select>

                    </div>

                    <button class="btn btn-primary w-100">
                        Add Subject
                    </button>

                </form>

            </div>

        </div>

        <!-- GPA Card -->
        <div class="col-md-7">

            <div class="card shadow p-4 text-center">

                <h3>Your GPA</h3>

                <h1 class="display-3 text-primary">

                    {{ gpa }}

                </h1>

            </div>

        </div>

    </div>


    <div class="card shadow mt-4">

        <div class="card-body">

            <h3 class="mb-3">Subjects</h3>

            {% if records %}

<table class="table table-striped">

...

</table>

{% else %}

<div class="text-center py-5">

<h3>🎓 No GPA records found</h3>

<p class="text-muted">

Add your subjects to calculate GPA.

</p>

</div>

{% endif %}

        </div>

    </div>

</div>

{% endblock %}
